[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "devdoctor"
version = "0.1.0"
description = "Your project's personal doctor."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "deviq404"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
devdoctor = "devdoctor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devdoctor"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

