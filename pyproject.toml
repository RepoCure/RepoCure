[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "repocure"
version = "2.0.0"
description = "A fast, local-first repository health scanner for security and quality."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "RepoCure"}]
keywords = ["repository", "security", "code-quality", "static-analysis", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "rich>=14.1,<15",
  "tomli>=2.2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.urls]
Homepage = "https://github.com/RepoCure/RepoCure"
Documentation = "https://github.com/RepoCure/RepoCure/tree/main/docs"
Issues = "https://github.com/RepoCure/RepoCure/issues"
Changelog = "https://github.com/RepoCure/RepoCure/blob/main/CHANGELOG.md"
Source = "https://github.com/RepoCure/RepoCure"

[project.scripts]
repocure = "repocure.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repocure"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
