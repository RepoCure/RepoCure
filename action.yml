name: RepoCure Repository Health
description: Scan a repository for security, quality, dependency, CI, Docker, and documentation issues.
author: RepoCure
branding:
  icon: activity
  color: blue
inputs:
  path:
    description: Repository path to scan
    default: .
  fail-under:
    description: Minimum acceptable health score
    default: "80"
  format:
    description: Report format (text, json, markdown, html, sarif)
    default: text
  output:
    description: Optional report output path
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install RepoCure
      shell: bash
      run: python -m pip install --disable-pip-version-check repocure==2.0.0
    - name: Scan repository
      shell: bash
      env:
        REPOCURE_PATH: ${{ inputs.path }}
        REPOCURE_FAIL_UNDER: ${{ inputs.fail-under }}
        REPOCURE_FORMAT: ${{ inputs.format }}
        REPOCURE_OUTPUT: ${{ inputs.output }}
      run: |
        args=(scan "$REPOCURE_PATH" --fail-under "$REPOCURE_FAIL_UNDER" --format "$REPOCURE_FORMAT")
        if [[ -n "$REPOCURE_OUTPUT" ]]; then args+=(--output "$REPOCURE_OUTPUT"); fi
        repocure "${args[@]}"

